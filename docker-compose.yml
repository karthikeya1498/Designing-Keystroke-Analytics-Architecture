services:
  postgres:
    image: postgres:16-alpine
    container_name: aegiskey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegiskey}
      POSTGRES_USER: ${POSTGRES_USER:-aegiskey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aegiskey-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegiskey} -d ${POSTGRES_DB:-aegiskey}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aegiskey-postgres-data:
