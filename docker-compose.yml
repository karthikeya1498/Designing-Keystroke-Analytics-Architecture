services:
  app-1:
    build:
      context: .
    container_name: aegiskey-app-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AEGISKEY_SESSION_SECRET: ${AEGISKEY_SESSION_SECRET:?Set AEGISKEY_SESSION_SECRET in .env.production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegiskey}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-aegiskey}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_1_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  app-2:
    build:
      context: .
    container_name: aegiskey-app-2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AEGISKEY_SESSION_SECRET: ${AEGISKEY_SESSION_SECRET:?Set AEGISKEY_SESSION_SECRET in .env.production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegiskey}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-aegiskey}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_2_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegiskey-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aegiskey-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
    container_name: aegiskey-ml
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: aegiskey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegiskey}
      POSTGRES_USER: ${POSTGRES_USER:-aegiskey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local before starting PostgreSQL}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aegiskey-postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_privacy_schema.sql:/docker-entrypoint-initdb.d/001-initial-privacy-schema.sql:ro
      - ./database/migrations/002_runtime_analytics_storage.sql:/docker-entrypoint-initdb.d/002-runtime-analytics-storage.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aegiskey} -d $${POSTGRES_DB:-aegiskey}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aegiskey-postgres-data:
  aegiskey-redis-data:
